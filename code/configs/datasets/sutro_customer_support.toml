slug = "sutro_customer_support"
source = "sutro/synthetic-customer-support-dialogues-20k"
hf_config = "default"
hf_split = "train"
sample_size = 100
download_batch_size = 100
conversation_id_prefix = "sutro_train"
raw_workbook_file = "../../datasets/sutro_customer_support/raw-data/sutro_customer_support_train_raw.xlsx"
annotated_workbook_file = "../../datasets/sutro_customer_support/annotation/cycle-1/sutro-customer-support_annotated_v0.75.xlsx"
annotated_workbook_sheet = "data"
annotation_validity_field = "validity"
annotation_validity_value = "yes"
product_category_field = "product_category"
product_subcategory_field = "product_subcategory"
annotated_pool_file = "{output_root}/processed/annotated_valid_cases_v0.75.json"
experiment_sample_file = "{output_root}/processed/morag_experiment_sample_1200.json"
sample_file = "{output_root}/processed/morag_experiment_sample_1200.json"
experience_cases_file = "{output_root}/processed/experience_cases.json"
reference_background_cases_file = "{output_root}/processed/reference_background_cases.json"
eval_cases_file = "{output_root}/processed/eval_cases.json"
split_metadata_file = "{output_root}/processed/split_metadata.json"
experiment_sample_count = 1200
popular_case_count = 1000
other_case_count = 200
experience_case_count = 400
reference_background_case_count = 200
eval_case_count = 600
experience_popular_case_count = 360
reference_background_popular_case_count = 160
eval_popular_case_count = 480
split_strategy = "popular_pairs_plus_other_then_experience_reference_eval"
experience_case_id_prefix = "experience"
reference_background_case_id_prefix = "reference"
eval_case_id_prefix = "eval"
past_conversation_field = "customer_support_dialogue"
future_dialogue_field = "new_customer_support_dialogue"
download_keep_columns = [
  "product_name",
  "product_description",
  "customer_support_dialogue",
  "issue_type",
  "issue_severity",
  "issue_description",
  "resolution_path_description",
  "outcome",
  "customer_sentiment",
  "customer_satisfaction",
  "new_customer_support_dialogue"
]

[conversation]
agent_speaker_labels = [
  "customer support agent",
  "support agent",
  "agent"
]
customer_speaker_labels = [
  "customer",
  "client",
  "user"
]
unknown_speaker_policy = "customer"
unlabeled_turn_policy = "alternate_customer_first"
